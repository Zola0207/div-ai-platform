<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Nema mreže — DiV.ai</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { width: 100%; max-width: 360px; text-align: center; }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #4f46e5;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
      }
      h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; }
      p { margin: 0 0 22px; font-size: 15px; line-height: 1.55; color: #475569; }
      .primary {
        display: block;
        padding: 13px 18px;
        border-radius: 12px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .secondary {
        margin-top: 14px;
        border: 0;
        background: none;
        color: #475569;
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">Di</div>
      <h1>Nema veze sa internetom</h1>
      <p>Sajt je i dalje tu — telefon trenutno nije na mreži. Proverite vezu i pokušajte ponovo.</p>
      <a class="primary" href="">Pokušaj ponovo</a>
      <button class="secondary" type="button" onclick="history.back()">Nazad na sajt</button>
    </main>
  </body>
</html>
